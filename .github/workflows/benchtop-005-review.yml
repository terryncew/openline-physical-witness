name: Benchtop 005 research-only checks
on:
  push:
    paths:
      - 'experiments/benchtop-005/**'
      - '.github/workflows/benchtop-005-review.yml'
  pull_request:
    paths:
      - 'experiments/benchtop-005/**'
      - '.github/workflows/benchtop-005-review.yml'
jobs:
  host-model-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.3
      - name: Reproduce model and adversarial host tests; confirm hardware HOLD
        working-directory: experiments/benchtop-005
        run: bash VERIFY_CANDIDATE.sh
