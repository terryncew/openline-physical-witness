  <text x="703" y="184" class="s">S − R differential</text>
  <text x="703" y="219" class="s">R − G independently</text>
  <text x="703" y="255" class="s">Two complex 3ω frequencies</text>
  <text x="703" y="289" class="s">Independent IDE witness</text>
  <text x="703" y="324" class="s">Match temp / EC / flow</text>
  <text x="703" y="358" class="s">Independent turbidity screen</text>
  <text x="703" y="386" class="s">Fresh service/blank evidence</text>
