<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Research-only functional diagram: common monitored process water feeds a sense, reference, and protected guard coupon. Independent reference-to-guard measurements gate any estimate. Physical testing required.">
