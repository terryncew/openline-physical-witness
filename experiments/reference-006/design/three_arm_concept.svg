  <rect x="340" y="220" width="280" height="90" class="box"/><text x="354" y="253" class="t">R — nominal reference</text><text x="354" y="278" class="s">Intentionally foul in challenge</text><rect x="352" y="289" width="125" height="8" fill="#8c9da8"/>
  <rect x="340" y="315" width="280" height="90" class="box"/><text x="354" y="348" class="t">G — protected witness</text><text x="354" y="373" class="s">Independent cleanliness inspection</text><rect x="352" y="384" width="125" height="8" fill="#76aa9a"/>
  </g>
  <path d="M620 169H679M620 265H679M620 360H679" class="water"/>
  <rect x="685" y="120" width="225" height="292" class="box"/>
