  <style>.t{font:600 19px Arial,sans-serif;fill:#1d2a36}.s{font:14px Arial,sans-serif;fill:#46505c}.h{font:600 28px Georgia,serif;fill:#192532}.water{stroke:#498aaa;stroke-width:9;stroke-linecap:round;fill:none}.box{fill:white;stroke:#bdc4c7;stroke-width:2;rx:12}.raw{stroke:#bc703d;stroke-width:3;fill:none;stroke-linecap:round}.warn{font:600 17px Arial,sans-serif;fill:#9a4b31}</style>
  <text x="40" y="48" class="h">Three-arm reference challenge</text>
  <text x="40" y="76" class="s">Functional concept only · no verified PCB or fluidics · no measured accuracy</text>
